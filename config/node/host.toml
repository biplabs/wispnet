# Independent per-host authority (ADR 0002). No HTTPS controller preflight.
schema_version = 2
device_name = "my-host"
state_dir = "/home/CHANGE_ME/.local/state/wispnet-host"
log_level = "info"

[transport]
# Direct development path. For an operated relay, configure the same HTTPS
# origin on host and clients; see docs/relay-connectivity.md.
# relay_url = "https://relay.wispnet.app"
# relay_only = false
# relay_ca_file = "/absolute/path/private-relay-ca.pem"
bind_addr = "127.0.0.1:7779"
max_connections = 16
max_streams = 64
max_streams_per_connection = 8
