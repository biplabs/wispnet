<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wispnet</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <aside>
    <div class="brand"><span class="mark">W</span> Wispnet</div>
    <div class="eyebrow">YOUR PRIVATE NETWORK</div>
    <nav aria-label="Main navigation"></nav>
    <div id="connection" role="status"></div>
  </aside>
  <main>
    <header>
      <div>
        <div class="eyebrow">CONNECTED, ON YOUR TERMS</div>
        <h1 id="heading">Services</h1>
      </div>
      <div class="actions">
        <button id="refresh">↻ Refresh</button>
        <button id="online">Go online</button>
      </div>
    </header>
    <div id="notice" role="alert" hidden></div>
    <section id="content"></section>
    <footer id="version"></footer>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <form id="form">
      <div id="dialog-body"></div>
      <p id="dialog-error" role="alert"></p>
      <div class="actions">
        <button type="button" id="cancel">Cancel</button>
        <button id="submit" class="primary">Continue</button>
      </div>
    </form>
  </dialog>
</body>
</html>
