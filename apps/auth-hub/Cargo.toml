[package]
name = "wispnet-command-center"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time"] }
serde.workspace = true
serde_json = "=1.0.150"
rusqlite = { version = "=0.38.0", features = ["bundled"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
url = "=2.5.8"
sha2 = "=0.10.9"
sha1 = "=0.11.0"
base64 = "=0.22.1"
rand = "=0.10.3"
ed25519-dalek = "=3.0.0"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
libc.workspace = true
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "service"] }

[dev-dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["form"] }
tempfile.workspace = true
futures-util = "=0.3.34"
tower = { version = "=0.5.3", features = ["util"] }
wispnet-core.workspace = true
tokio = { workspace = true, features = ["test-util"] }
