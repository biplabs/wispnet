[project]
name = "wispnet-desktop"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials==6.10.2"]
[project.scripts]
wispnet-desktop = "wispnet_desktop.app:main"
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "wispnet_desktop/version.py"
