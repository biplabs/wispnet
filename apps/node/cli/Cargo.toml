[package]
name = "wispnet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde_json = "=1.0.150"
wispnet-core.workspace = true
wispnet-agent.workspace = true
wispnet-node = { path = "../daemon" }
wispnet-registry.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util"] }
tracing.workspace = true
zeroize.workspace = true
tracing-subscriber.workspace = true
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29.0", features = ["osc52"] }
libc.workspace = true
tempfile.workspace = true
signal-hook = "=0.3.18"
url = "=2.5.8"

[[bin]]
name = "wispnet"
path = "src/main.rs"

[dev-dependencies]
irelay = { package = "iroh-relay", version = "=1.3.0", default-features = false, features = ["server"] }
rcgen = "=0.14.8"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "=1.15.1"
tokio = { workspace = true, features = ["process", "time", "net"] }
# Isolated Sites wire-compatibility probe; not used by the application transport.
iroh-base.workspace = true
blake3 = "=1.8.7"
n0-future = "=0.3.2"
http = "=1.5.0"
tokio-websockets = { version = "=0.13.3", features = ["client", "ring", "rustls-webpki-roots"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }
webpki-roots = "=1.0.9"
