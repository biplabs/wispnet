[package]
name = "wispnet-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "wispnet_client"
crate-type = ["rlib"]

[dependencies]
serde.workspace = true
libc.workspace = true
wispnet-core.workspace = true
wispnet-agent.workspace = true
wispnet-registry.workspace = true
iroh.workspace = true
serde_json = "=1.0.150"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "io-util", "time"] }
httparse = "=1.10.1"
base64 = "=0.22.1"
sha1 = "=0.11.0"
url = "=2.5.8"
zeroize.workspace = true
wispnet-shell = { path = "../shell" }

hyper = { version = "=1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
wispnet-shell = { path = "../shell", features = ["host"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
