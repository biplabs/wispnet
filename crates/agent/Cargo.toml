[package]
name = "wispnet-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "=0.22.1"
wispnet-core.workspace = true
wispnet-registry.workspace = true
tracing.workspace = true
zeroize.workspace = true
tempfile.workspace = true
libc.workspace = true

iroh = { workspace = true, features = ["unstable-net-report"] }
tokio = { workspace = true, features = ["time", "sync", "net", "io-util"] }
serde_json = "=1.0.150"

iroh-relay = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
rustls-pki-types = "=1.15.1"

n0-error = "=1.0.1"
n0-future = "=0.3.2"

[dev-dependencies]
iroh-relay = { version = "=1.3.0", default-features = false, features = ["server"] }
rcgen = "=0.14.8"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
wispnet-shell = { workspace = true, features = ["host"] }
