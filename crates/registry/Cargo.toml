[package]
name = "wispnet-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
wispnet-core.workspace = true
tracing.workspace = true
rusqlite = { version = "=0.38.0", features = ["bundled", "backup"] }
libc.workspace = true

serde.workspace = true
serde_json = "=1.0.150"
tokio = { workspace = true, features = ["net", "time", "sync"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
sha2 = "=0.10.9"
zeroize.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
tempfile.workspace = true

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
rcgen = "=0.14.8"
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }
