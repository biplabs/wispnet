[package]
name = "wipsnet-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde_json = "=1.0.150"
wipsnet-core.workspace = true
wipsnet-agent.workspace = true
wipsnet-registry.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util"] }
tracing.workspace = true
zeroize.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "wipsnet"
path = "src/main.rs"

[dev-dependencies]
irelay = { package = "iroh-relay", version = "=1.3.0", default-features = false, features = ["server"] }
rcgen = "=0.14.8"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "=1.15.1"
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "time", "net"] }
