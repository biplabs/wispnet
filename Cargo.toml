[workspace]
members = ["crates/core", "crates/agent", "crates/registry", "apps/node/cli", "apps/relay", "apps/public-gateway", "apps/flutter/android/native", "crates/client", "apps/node/daemon"]
resolver = "3"
exclude = ["vendor/iroh"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
wispnet-core = { path = "crates/core" }
wispnet-agent = { path = "crates/agent" }
wispnet-registry = { path = "crates/registry" }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"
tokio = { version = "=1.53.3", features = ["rt", "macros", "signal"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }
iroh-base = { version = "=1.3.0", default-features = false, features = ["key"] }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "portmapper"] }
zeroize = "=1.9.1"
tempfile = "=3.27.0"
libc = "=0.2.190"

[patch.crates-io]
iroh = { path = "vendor/iroh" }
