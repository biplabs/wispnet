[workspace]
members = ["crates/core", "crates/agent", "crates/registry", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
wipsnet-core = { path = "crates/core" }
wipsnet-agent = { path = "crates/agent" }
wipsnet-registry = { path = "crates/registry" }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"
tokio = { version = "=1.53.3", features = ["rt", "macros", "signal"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }
